name: Deploy Backend to PythonAnywhere

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_to_pythonanywhere:
    name: Sync & Deploy to PythonAnywhere
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Deployment Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Deployment & Synchronization
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME || 'erpUMA' }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN || 'e023a655a10e258afcd2b8ff184bdc339fd4c30a' }}
          PA_DOMAIN: ${{ secrets.PA_DOMAIN || 'erpuma.pythonanywhere.com' }}
          DEPLOY_SECRET_KEY: ${{ secrets.DEPLOY_SECRET_KEY || 'uma-erp-deploy-key-2026-secure-sync' }}
          DEPLOY_BRANCH: 'main'
        run: |
          python deploy_backend_sync.py --ci
